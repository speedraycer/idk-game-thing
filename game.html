<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f6d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quad Rush">
<title>Quad Rush</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%234caf50'/%3E%3Crect x='20' y='20' width='26' height='26' rx='5' fill='%23e53935'/%3E%3Crect x='54' y='20' width='26' height='26' rx='5' fill='%231e88e5'/%3E%3Crect x='20' y='54' width='26' height='26' rx='5' fill='%23fdd835'/%3E%3Crect x='54' y='54' width='26' height='26' rx='5' fill='%2343a047'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #0c1a08; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(10px + env(safe-area-inset-bottom));
    z-index: 5; text-align: center; color: #cfeeb0; font-size: 13px; font-weight: 700;
    letter-spacing: 1px; text-shadow: 0 2px 0 rgba(0,0,0,.5); pointer-events: none; opacity: .9;
  }
</style>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">AUTO-BATTLE • each cube blasts its OWN color • tap to restart</div>

<script>
(() => {
  "use strict";

  const COLORS = { red:"#e53935", green:"#43a047", blue:"#1e88e5", yellow:"#fdd835" };
  const DARK   = { red:"#8e1f1c", green:"#255a27", blue:"#114a80", yellow:"#8a7413" };
  const KEYS = ["red", "green", "blue", "yellow"];

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let DPR = 1, W = 0, H = 0;

  // board / arena geometry (computed in resize)
  let board = { x:0, y:0, w:0, h:0 };
  let arena = { x:0, y:0, w:0, h:0 };   // where cubes bounce
  let barZoneH = 0;                     // top region with the 4 color bars

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // portrait board, phone-shaped, centered
    const maxW = Math.min(W - 20, 560);
    const maxH = H - 30;
    let bw = maxW, bh = bw * 1.9;
    if (bh > maxH) { bh = maxH; bw = Math.min(maxW, bh / 1.9); }
    board = { x: (W - bw) / 2, y: (H - bh) / 2, w: bw, h: bh };

    barZoneH = Math.max(70, board.h * 0.17);
    const pad = board.w * 0.045;
    arena = {
      x: board.x + pad,
      y: board.y + barZoneH + pad,
      w: board.w - pad * 2,
      h: board.h - barZoneH - pad * 2,
    };
    if (state) rescaleEntities();
  }
  window.addEventListener("resize", () => { resize(); });
  window.addEventListener("orientationchange", () => setTimeout(resize, 60));

  // ---------- weapons ----------
  const WEAPONS = {
    pistol:  { name:"pistol",  ammo:8,  interval:360, dmg:3, pellets:1, spread:0 },
    revolver:{ name:"revolver",ammo:6,  interval:300, dmg:5, pellets:1, spread:0 },
    shotgun: { name:"shotgun", ammo:5,  interval:620, dmg:2, pellets:3, spread:0.22 },
  };
  const WEAPON_TYPES = Object.keys(WEAPONS);

  // ---------- game state ----------
  let state = null;
  let particles = [];
  let floaters = [];   // rising damage / win text

  function newRound(round) {
    const cubeSize = Math.max(26, arena.w * 0.11);
    const speed = arena.h * 0.28;               // px/sec, constant magnitude
    const startCount = 70 + round * 20;

    const cubes = KEYS.map((color, i) => {
      const ang = Math.random() * Math.PI * 2;
      return {
        color,
        x: arena.x + arena.w * (0.28 + 0.44 * (i % 2)),
        y: arena.y + arena.h * (0.32 + 0.30 * (i > 1 ? 1 : 0)),
        vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
        size: cubeSize,
        weapon: null, ammo: 0, cd: 0,
        recoil: 0, hitFlash: 0,
      };
    });

    const goals = {};
    KEYS.forEach(k => goals[k] = { count: startCount, max: startCount });

    state = {
      round, cubes, goals, speed,
      projectiles: [], pickups: [],
      spawnTimer: 0, winner: null, winTimer: 0,
      spikes: makeSpikes(),
    };
  }

  function makeSpikes() {
    // a few interior bumpers the cubes ricochet off, like the reference arena
    const s = [];
    const n = 2 + (Math.random() < 0.5 ? 1 : 0);
    for (let i = 0; i < n; i++) {
      s.push({
        x: arena.x + arena.w * (0.25 + Math.random() * 0.5),
        y: arena.y + arena.h * (0.30 + Math.random() * 0.45),
        r: arena.w * 0.05,
      });
    }
    return s;
  }

  function rescaleEntities() {
    // keep cubes inside the arena after a resize
    for (const c of state.cubes) {
      c.size = Math.max(26, arena.w * 0.11);
      c.x = Math.min(Math.max(c.x, arena.x + c.size/2), arena.x + arena.w - c.size/2);
      c.y = Math.min(Math.max(c.y, arena.y + c.size/2), arena.y + arena.h - c.size/2);
    }
  }

  // ---------- helpers ----------
  function barRect(color) {
    const i = KEYS.indexOf(color);
    const gap = 6, n = KEYS.length;
    const w = (board.w - gap * (n + 1)) / n;
    const x = board.x + gap + i * (w + gap);
    const y = board.y + 8;
    const h = barZoneH - 16;
    return { x, y, w, h };
  }
  function barTarget(color) { const r = barRect(color); return { x: r.x + r.w/2, y: r.y + r.h - 10 }; }

  function spark(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = (spd||3) * (0.4 + Math.random());
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color, size: 2 + Math.random()*3 });
    }
  }

  // ---------- update ----------
  function update(dt) {
    const st = state;

    if (st.winner) {
      st.winTimer -= dt;
      updateFx(dt);
      if (st.winTimer <= 0) newRound(st.round + 1);
      return;
    }

    // weapon pickups spawn
    st.spawnTimer -= dt;
    if (st.spawnTimer <= 0 && st.pickups.length < 4) {
      st.spawnTimer = 1.1 + Math.random() * 1.0;
      st.pickups.push({
        x: arena.x + arena.w * (0.12 + Math.random() * 0.76),
        y: arena.y + arena.h * (0.12 + Math.random() * 0.76),
        type: WEAPON_TYPES[Math.floor(Math.random() * WEAPON_TYPES.length)],
        bob: Math.random() * Math.PI * 2,
      });
    }

    // move cubes (constant-speed bouncing)
    for (const c of st.cubes) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      const hs = c.size / 2;
      if (c.x - hs < arena.x)            { c.x = arena.x + hs;            c.vx = Math.abs(c.vx); }
      if (c.x + hs > arena.x + arena.w)  { c.x = arena.x + arena.w - hs;  c.vx = -Math.abs(c.vx); }
      if (c.y - hs < arena.y)            { c.y = arena.y + hs;            c.vy = Math.abs(c.vy); }
      if (c.y + hs > arena.y + arena.h)  { c.y = arena.y + arena.h - hs;  c.vy = -Math.abs(c.vy); }
      if (c.recoil > 0) c.recoil = Math.max(0, c.recoil - dt * 6);
      if (c.hitFlash > 0) c.hitFlash = Math.max(0, c.hitFlash - dt * 3);

      // bounce off interior spikes
      for (const sp of st.spikes) {
        const dx = c.x - sp.x, dy = c.y - sp.y, rr = sp.r + hs;
        const d2 = dx*dx + dy*dy;
        if (d2 < rr*rr && d2 > 0.001) {
          const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
          c.x = sp.x + nx * rr; c.y = sp.y + ny * rr;
          const dot = c.vx*nx + c.vy*ny;
          c.vx -= 2*dot*nx; c.vy -= 2*dot*ny;
        }
      }
    }

    // cube-cube collisions
    for (let i = 0; i < st.cubes.length; i++) for (let j = i+1; j < st.cubes.length; j++) {
      const a = st.cubes[i], b = st.cubes[j];
      const dx = b.x - a.x, dy = b.y - a.y, min = (a.size + b.size) / 2;
      const d2 = dx*dx + dy*dy;
      if (d2 < min*min && d2 > 0.001) {
        const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, overlap = (min - d) / 2;
        a.x -= nx*overlap; a.y -= ny*overlap; b.x += nx*overlap; b.y += ny*overlap;
        const va = a.vx*nx + a.vy*ny, vb = b.vx*nx + b.vy*ny;
        const diff = vb - va;
        a.vx += diff*nx; a.vy += diff*ny; b.vx -= diff*nx; b.vy -= diff*ny;
      }
    }

    // normalize speed so motion never dies out
    for (const c of st.cubes) {
      const m = Math.hypot(c.vx, c.vy) || 1;
      c.vx = c.vx / m * st.speed; c.vy = c.vy / m * st.speed;
    }

    // pickups: an unarmed cube grabs an overlapping weapon
    for (let p = st.pickups.length - 1; p >= 0; p--) {
      const pk = st.pickups[p]; pk.bob += dt * 4;
      for (const c of st.cubes) {
        if (c.weapon) continue;
        if (Math.abs(c.x - pk.x) < c.size*0.7 && Math.abs(c.y - pk.y) < c.size*0.7) {
          const w = WEAPONS[pk.type];
          c.weapon = pk.type; c.ammo = w.ammo; c.cd = 0.15;
          st.pickups.splice(p, 1);
          spark(pk.x, pk.y, "#fff", 10, 3);
          break;
        }
      }
    }

    // armed cubes fire at their OWN color bar
    for (const c of st.cubes) {
      if (!c.weapon || st.goals[c.color].count <= 0) continue;
      c.cd -= dt;
      if (c.cd <= 0) {
        const w = WEAPONS[c.weapon];
        c.cd = w.interval / 1000;
        c.ammo--; c.recoil = 1;
        const tgt = barTarget(c.color);
        const baseAng = Math.atan2(tgt.y - c.y, tgt.x - c.x);
        for (let k = 0; k < w.pellets; k++) {
          const off = (w.pellets > 1 ? (k - (w.pellets-1)/2) : 0) * w.spread;
          const a = baseAng + off;
          const sp = arena.h * 1.7;
          st.projectiles.push({ x: c.x, y: c.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                                color: c.color, dmg: w.dmg });
        }
        if (navigator.vibrate) navigator.vibrate(8);
        if (c.ammo <= 0) c.weapon = null;
      }
    }

    // projectiles travel to their color bar and damage it
    for (let p = st.projectiles.length - 1; p >= 0; p--) {
      const pr = st.projectiles[p];
      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      const tgt = barTarget(pr.color);
      const reached = pr.y <= tgt.y + 4;
      const off = pr.x < board.x || pr.x > board.x + board.w || pr.y < board.y - 20;
      if (reached || off) {
        if (reached && st.goals[pr.color].count > 0) {
          st.goals[pr.color].count = Math.max(0, st.goals[pr.color].count - pr.dmg);
          const r = barRect(pr.color);
          spark(pr.x, r.y + r.h - 6, COLORS[pr.color], 8, 3);
          if (st.goals[pr.color].count === 0) declareWinner(pr.color);
        }
        st.projectiles.splice(p, 1);
      }
    }

    updateFx(dt);
  }

  function declareWinner(color) {
    state.winner = color; state.winTimer = 3.0;
    const cx = board.x + board.w/2, cy = board.y + board.h*0.42;
    for (let i = 0; i < 90; i++) spark(cx, cy, KEYS[i % 4] === color ? COLORS[color] : COLORS[KEYS[i%4]], 1, 8);
    floaters.push({ x: cx, y: cy, text: color.toUpperCase() + " WINS!", color, life: 3.0, big: true });
    if (navigator.vibrate) navigator.vibrate([50, 60, 50, 60, 120]);
  }

  function updateFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life -= dt * 1.6;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i]; f.y -= dt * 14; f.life -= dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }

  // ---------- render ----------
  function rrect(x, y, w, h, r) {
    r = Math.min(r, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r); ctx.closePath();
  }

  function draw() {
    const st = state;
    // checkered frame
    ctx.fillStyle = "#2f6d1f"; ctx.fillRect(0, 0, W, H);
    const cs = 26; ctx.fillStyle = "rgba(0,0,0,.10)";
    for (let y = 0; y < H; y += cs) for (let x = 0; x < W; x += cs)
      if (((x/cs|0)+(y/cs|0)) & 1) ctx.fillRect(x, y, cs, cs);

    // board
    ctx.fillStyle = "#79c24a"; rrect(board.x, board.y, board.w, board.h, 16); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.stroke();

    // color goal bars
    for (const k of KEYS) drawBar(k);

    // arena
    ctx.fillStyle = "#a6d977"; rrect(arena.x, arena.y, arena.w, arena.h, 12); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();
    ctx.save(); rrect(arena.x, arena.y, arena.w, arena.h, 12); ctx.clip();

    // spikes / bumpers
    for (const sp of st.spikes) drawSpikeBall(sp);
    // pickups
    for (const pk of st.pickups) drawWeaponIcon(pk.x, pk.y + Math.sin(pk.bob)*3, pk.type, arena.w*0.09);
    // projectiles
    for (const pr of st.projectiles) {
      ctx.fillStyle = COLORS[pr.color];
      ctx.save(); ctx.shadowColor = COLORS[pr.color]; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.max(3, arena.w*0.016), 0, 7); ctx.fill();
      ctx.restore();
    }
    // cubes
    for (const c of st.cubes) drawCube(c);
    ctx.restore();

    // particles
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // watermark
    ctx.fillStyle = "rgba(20,55,12,.4)";
    ctx.font = `700 ${Math.max(13, arena.w*0.06)}px system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("@quadrush2d", board.x + board.w/2, arena.y + arena.h - 12);

    // floaters + winner banner
    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      if (f.big) {
        const s = Math.max(30, board.w*0.13);
        ctx.font = `900 ${s}px system-ui, sans-serif`;
        ctx.lineWidth = s*0.14; ctx.strokeStyle = "rgba(0,0,0,.6)";
        ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = COLORS[f.color];
        ctx.fillText(f.text, f.x, f.y);
      }
      ctx.globalAlpha = 1;
    }

    // round label
    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.font = `800 ${Math.max(13, board.w*0.045)}px system-ui, sans-serif`;
    ctx.fillText("ROUND " + st.round, board.x + 12, board.y + barZoneH + 6);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawBar(color) {
    const r = barRect(color), g = state.goals[color];
    const frac = g.count / g.max;
    ctx.fillStyle = "rgba(0,0,0,.22)"; rrect(r.x, r.y, r.w, r.h, 8); ctx.fill();
    const fh = (r.h - 6) * frac;
    ctx.fillStyle = COLORS[color];
    rrect(r.x + 3, r.y + 3 + (r.h - 6 - fh), r.w - 6, Math.max(0, fh), 6); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = DARK[color]; rrect(r.x, r.y, r.w, r.h, 8); ctx.stroke();
    // count number
    ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `900 ${Math.max(16, r.w*0.42)}px system-ui, sans-serif`;
    ctx.lineWidth = Math.max(3, r.w*0.06); ctx.strokeStyle = "rgba(0,0,0,.55)";
    ctx.strokeText(g.count, r.x + r.w/2, r.y + r.h/2);
    ctx.fillText(g.count, r.x + r.w/2, r.y + r.h/2);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawCube(c) {
    const s = c.size, x = c.x - s/2, y = c.y - s/2, r = s*0.2;
    const flash = c.hitFlash > 0;
    ctx.save();
    ctx.fillStyle = flash ? "#fff" : COLORS[c.color];
    rrect(x, y, s, s, r); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.18)"; rrect(x, y + s*0.72, s, s*0.28, r); ctx.fill();
    ctx.lineWidth = Math.max(2, s*0.07); ctx.strokeStyle = "rgba(0,0,0,.5)"; rrect(x, y, s, s, r); ctx.stroke();
    // angry eyes
    const ew = s*0.24, eh = s*0.24, ey = y + s*0.26;
    const ex1 = x + s*0.16, ex2 = x + s*0.6;
    ctx.fillStyle = "#fff"; rrect(ex1, ey, ew, eh, ew*0.3); ctx.fill(); rrect(ex2, ey, ew, eh, ew*0.3); ctx.fill();
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(ex1+ew*0.5, ey+eh*0.6, ew*0.32, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(ex2+ew*0.5, ey+eh*0.6, ew*0.32, 0, 7); ctx.fill();
    // angry brows
    ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(2, s*0.06); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(ex1, ey-2); ctx.lineTo(ex1+ew, ey+eh*0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex2+ew, ey-2); ctx.lineTo(ex2, ey+eh*0.35); ctx.stroke();
    ctx.restore();
    // held weapon
    if (c.weapon) {
      const gx = c.x + s*0.42, gy = c.y - s*0.05 + c.recoil*3;
      drawWeaponIcon(gx, gy, c.weapon, s*0.6);
      // ammo pips
      ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.font = `800 ${Math.max(9, s*0.24)}px system-ui, sans-serif`;
      ctx.fillText("×" + c.ammo, c.x, c.y - s*0.55);
      ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    }
  }

  function drawSpikeBall(sp) {
    ctx.save(); ctx.translate(sp.x, sp.y);
    const spikes = 10, ro = sp.r, ri = sp.r*0.6;
    ctx.beginPath();
    for (let i = 0; i < spikes*2; i++) {
      const a = (i/(spikes*2)) * Math.PI*2, rad = (i%2===0) ? ro : ri;
      ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad);
    }
    ctx.closePath();
    ctx.fillStyle = "#8e24aa"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#4a148c"; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, ri*0.5, 0, 7); ctx.fillStyle = "#6a1b8a"; ctx.fill();
    ctx.restore();
  }

  function drawWeaponIcon(x, y, type, size) {
    ctx.save(); ctx.translate(x, y);
    const w = size, h = size*0.5;
    ctx.fillStyle = "#2b2b2b"; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
    if (type === "shotgun") {
      rrect(-w*0.55, -h*0.18, w*1.1, h*0.34, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#8a5a2b"; rrect(w*0.15, -h*0.1, w*0.45, h*0.5, 2); ctx.fill(); ctx.stroke();
    } else if (type === "revolver") {
      rrect(-w*0.5, -h*0.15, w*0.9, h*0.28, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#3b3b3b"; ctx.beginPath(); ctx.arc(-w*0.05, 0, h*0.28, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2b2b2b"; rrect(-w*0.2, h*0.05, w*0.22, h*0.6, 2); ctx.fill(); ctx.stroke();
    } else { // pistol
      rrect(-w*0.45, -h*0.16, w*0.9, h*0.3, 2); ctx.fill(); ctx.stroke();
      rrect(-w*0.25, h*0.02, w*0.24, h*0.55, 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = 0;
  function loop(now) {
    let dt = (now - last) / 1000; last = now;
    if (dt > 0.05) dt = 0.05;   // clamp big frame gaps
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // tap to restart current run
  canvas.addEventListener("pointerdown", () => { newRound(1); });

  resize();
  newRound(1);
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
