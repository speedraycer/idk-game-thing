<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='16' fill='%234caf50'/%3E%3Crect x='20' y='20' width='26' height='26' rx='5' fill='%23e53935'/%3E%3Crect x='54' y='20' width='26' height='26' rx='5' fill='%231e88e5'/%3E%3Crect x='20' y='54' width='26' height='26' rx='5' fill='%23fdd835'/%3E%3Crect x='54' y='54' width='26' height='26' rx='5' fill='%2343a047'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; background: #0c1a08; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: calc(8px + env(safe-area-inset-bottom));
    z-index: 5; text-align: center; color: #bfe89a; font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-shadow: 0 2px 0 rgba(0,0,0,.5); pointer-events: none; opacity: .85;
  }
</style>

<div id="wrap"><canvas id="c"></canvas></div>
<div id="hint">AUTO-BATTLE • every cube smashes its OWN color • walls block them • tap for a new random battle</div>

<script>
(() => {
  "use strict";

  // full colour palette — a round picks a random subset of these
  const PAL = {
    red:   { c:"#e53935", d:"#7c1a17" },
    green: { c:"#43a047", d:"#1f4a21" },
    blue:  { c:"#1e88e5", d:"#0e3c69" },
    yellow:{ c:"#fdd835", d:"#7a660f" },
    orange:{ c:"#fb8c00", d:"#7a4300" },
    purple:{ c:"#8e24aa", d:"#45114f" },
    cyan:  { c:"#00bcd4", d:"#005e6b" },
    pink:  { c:"#ec407a", d:"#7a1540" },
  };
  const PAL_KEYS = Object.keys(PAL);

  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  let DPR = 1, W = 0, H = 0;

  let board = { x:0, y:0, w:0, h:0 };
  let topH = 0, stackW = 0, margin = 0;
  let arena = { x:0, y:0, w:0, h:0, mid:0 };   // central bounce channel

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth; H = window.innerHeight;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const maxW = Math.min(W - 18, 560);
    const maxH = H - 24;
    let bw = maxW, bh = bw * 1.92;
    if (bh > maxH) { bh = maxH; bw = Math.min(maxW, bh / 1.92); }
    board = { x: (W - bw) / 2, y: (H - bh) / 2, w: bw, h: bh };

    topH = Math.max(52, board.h * 0.085);
    margin = board.w * 0.03;
    stackW = board.w * 0.155;

    const aTop = board.y + topH + margin;
    const aBot = board.y + board.h - margin;
    const aX0 = board.x + margin + stackW;
    const aX1 = board.x + board.w - margin - stackW;
    arena = { x: aX0, y: aTop, w: aX1 - aX0, h: aBot - aTop, mid: (aTop + aBot) / 2 };
    if (state) layoutStacks(state.colors);
  }
  window.addEventListener("resize", () => resize());
  window.addEventListener("orientationchange", () => setTimeout(resize, 60));

  const WEAPONS = {
    pistol:  { ammo:8,  interval:340, dmg:3, pellets:1, spread:0 },
    revolver:{ ammo:6,  interval:300, dmg:5, pellets:1, spread:0 },
    shotgun: { ammo:5,  interval:600, dmg:2, pellets:3, spread:0.18 },
    smg:     { ammo:14, interval:150, dmg:2, pellets:1, spread:0.05 },
  };
  const WEAPON_TYPES = Object.keys(WEAPONS);

  let state = null, particles = [], floaters = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const ri  = (a, b) => Math.floor(rnd(a, b + 1));
  function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  // per-round stack geometry (colour -> {x,y,w,h,side})
  let region = {};
  function layoutStacks(colors) {
    region = {};
    const N = colors.length, nL = Math.ceil(N / 2);
    const L = colors.slice(0, nL), R = colors.slice(nL);
    const lx = board.x + margin, rx = board.x + board.w - margin - stackW;
    const place = (arr, x, side) => {
      const gap = 6, h = (arena.h - gap * (arr.length - 1)) / Math.max(1, arr.length);
      arr.forEach((col, i) => { region[col] = { x, y: arena.y + i * (h + gap), w: stackW, h, side }; });
    };
    place(L, lx, "L"); place(R, rx, "R");
  }

  // ---------- round setup (randomises EVERYTHING) ----------
  function newRound(round) {
    const N = ri(2, 8);                                   // random cube count
    const colors = shuffle(PAL_KEYS).slice(0, N);
    layoutStacks(colors);

    const speed = arena.h * rnd(0.20, 0.36);              // random pace
    const baseSize = Math.max(20, arena.w * (0.62 / Math.sqrt(N)));
    const weaponPool = shuffle(WEAPON_TYPES).slice(0, ri(2, WEAPON_TYPES.length));

    // random solid walls that block cubes and shots (fractions of the arena)
    const walls = [];
    const wallN = ri(1, 4);
    for (let i = 0; i < wallN; i++) {
      const vert = Math.random() < 0.5;
      if (vert) walls.push({ fx: rnd(0.18, 0.72), fy: rnd(0.10, 0.45), fw: rnd(0.05, 0.09), fh: rnd(0.20, 0.42) });
      else      walls.push({ fx: rnd(0.10, 0.45), fy: rnd(0.18, 0.78), fw: rnd(0.24, 0.5), fh: rnd(0.05, 0.09) });
    }

    // random spike bumpers
    const spikes = [];
    const spikeN = ri(0, 3);
    for (let i = 0; i < spikeN; i++)
      spikes.push({ fx: rnd(0.2, 0.8), fy: rnd(0.2, 0.8), r: arena.w * rnd(0.05, 0.09) });

    const goals = {};
    colors.forEach(col => { const c = ri(40, 60) + round * 20; goals[col] = { count: c, max: c }; });

    const cubes = [];
    for (const color of colors) {
      const size = baseSize * rnd(0.9, 1.12);
      const pos = spawnPos(size, cubes, walls);
      const ang = Math.random() * Math.PI * 2;
      cubes.push({ color, x: pos.x, y: pos.y, vx: Math.cos(ang)*speed, vy: Math.sin(ang)*speed,
                   size, weapon: null, ammo: 0, cd: 0, recoil: 0, trail: [] });
    }

    state = { round, colors, cubes, goals, speed, weaponPool, walls, spikes,
              projectiles: [], pickups: [], spawnTimer: 0.4, spawnGap: rnd(0.7, 1.6),
              winner: null, winTimer: 0 };
  }

  function wallsAbs() {
    return state.walls.map(w => ({ x: arena.x + w.fx*arena.w, y: arena.y + w.fy*arena.h,
                                   w: w.fw*arena.w, h: w.fh*arena.h }));
  }
  function spikesAbs() {
    return state.spikes.map(s => ({ x: arena.x + s.fx*arena.w, y: arena.y + s.fy*arena.h, r: s.r }));
  }

  function spawnPos(size, others, walls) {
    const hs = size/2;
    for (let t = 0; t < 80; t++) {
      const x = rnd(arena.x + hs + 2, arena.x + arena.w - hs - 2);
      const y = rnd(arena.y + hs + 2, arena.y + arena.h - hs - 2);
      let ok = true;
      for (const w of walls) {
        const ax = arena.x + w.fx*arena.w, ay = arena.y + w.fy*arena.h, aw = w.fw*arena.w, ah = w.fh*arena.h;
        if (x > ax - hs && x < ax + aw + hs && y > ay - hs && y < ay + ah + hs) { ok = false; break; }
      }
      if (ok) for (const o of others) if (Math.hypot(o.x - x, o.y - y) < (o.size + size) * 0.7) { ok = false; break; }
      if (ok) return { x, y };
    }
    return { x: arena.x + arena.w/2, y: arena.y + arena.h/2 };
  }

  function stackTarget(color) {
    const r = region[color];
    return { x: r.side === "L" ? r.x + r.w : r.x, y: r.y + r.h / 2, side: r.side };
  }

  function spark(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random()*Math.PI*2, s = (spd||3)*(0.4+Math.random());
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, color, size: 2+Math.random()*3 });
    }
  }

  // ---------- update ----------
  function update(dt) {
    const st = state;
    if (st.winner) { st.winTimer -= dt; updateFx(dt); if (st.winTimer <= 0) newRound(st.round + 1); return; }

    const walls = wallsAbs(), spikes = spikesAbs();

    st.spawnTimer -= dt;
    if (st.spawnTimer <= 0 && st.pickups.length < 3) {
      st.spawnTimer = st.spawnGap;
      const p = spawnPos(arena.w*0.14, [], st.walls);
      st.pickups.push({ x: p.x, y: p.y, type: st.weaponPool[ri(0, st.weaponPool.length-1)], bob: Math.random()*6 });
    }

    for (const c of st.cubes) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      const hs = c.size / 2;
      if (c.x - hs < arena.x)           { c.x = arena.x + hs;           c.vx =  Math.abs(c.vx); }
      if (c.x + hs > arena.x + arena.w) { c.x = arena.x + arena.w - hs; c.vx = -Math.abs(c.vx); }
      if (c.y - hs < arena.y)           { c.y = arena.y + hs;           c.vy =  Math.abs(c.vy); }
      if (c.y + hs > arena.y + arena.h) { c.y = arena.y + arena.h - hs; c.vy = -Math.abs(c.vy); }
      // solid walls block cubes (AABB reflect on the shallowest axis)
      for (const w of walls) {
        const ex = w.x - hs, ey = w.y - hs, ew = w.w + c.size, eh = w.h + c.size;
        if (c.x > ex && c.x < ex+ew && c.y > ey && c.y < ey+eh) {
          const l = c.x-ex, r = ex+ew-c.x, t = c.y-ey, b = ey+eh-c.y, m = Math.min(l, r, t, b);
          if (m===l)      { c.x = ex;      c.vx = -Math.abs(c.vx); }
          else if (m===r) { c.x = ex+ew;   c.vx =  Math.abs(c.vx); }
          else if (m===t) { c.y = ey;      c.vy = -Math.abs(c.vy); }
          else            { c.y = ey+eh;   c.vy =  Math.abs(c.vy); }
        }
      }
      if (c.recoil > 0) c.recoil = Math.max(0, c.recoil - dt*6);
      c.trail.push({ x: c.x, y: c.y }); if (c.trail.length > 9) c.trail.shift();
      for (const sp of spikes) {
        const dx = c.x-sp.x, dy = c.y-sp.y, rr = sp.r+hs, d2 = dx*dx+dy*dy;
        if (d2 < rr*rr && d2 > 0.001) { const d = Math.sqrt(d2), nx = dx/d, ny = dy/d;
          c.x = sp.x+nx*rr; c.y = sp.y+ny*rr; const dot = c.vx*nx+c.vy*ny; c.vx -= 2*dot*nx; c.vy -= 2*dot*ny; }
      }
    }

    for (let i = 0; i < st.cubes.length; i++) for (let j = i+1; j < st.cubes.length; j++) {
      const a = st.cubes[i], b = st.cubes[j];
      const dx = b.x-a.x, dy = b.y-a.y, min = (a.size+b.size)/2, d2 = dx*dx+dy*dy;
      if (d2 < min*min && d2 > 0.001) { const d = Math.sqrt(d2), nx = dx/d, ny = dy/d, ov = (min-d)/2;
        a.x -= nx*ov; a.y -= ny*ov; b.x += nx*ov; b.y += ny*ov;
        const va = a.vx*nx+a.vy*ny, vb = b.vx*nx+b.vy*ny, diff = vb-va;
        a.vx += diff*nx; a.vy += diff*ny; b.vx -= diff*nx; b.vy -= diff*ny; }
    }

    for (const c of st.cubes) { const m = Math.hypot(c.vx, c.vy) || 1; c.vx = c.vx/m*st.speed; c.vy = c.vy/m*st.speed; }

    for (let p = st.pickups.length-1; p >= 0; p--) {
      const pk = st.pickups[p]; pk.bob += dt*4;
      for (const c of st.cubes) {
        if (c.weapon) continue;
        if (Math.abs(c.x-pk.x) < c.size*0.65 && Math.abs(c.y-pk.y) < c.size*0.65) {
          const w = WEAPONS[pk.type]; c.weapon = pk.type; c.ammo = w.ammo; c.cd = 0.12;
          st.pickups.splice(p,1); spark(pk.x, pk.y, "#fff", 10, 3); break;
        }
      }
    }

    for (const c of st.cubes) {
      if (!c.weapon || st.goals[c.color].count <= 0) continue;
      c.cd -= dt;
      if (c.cd <= 0) {
        const w = WEAPONS[c.weapon]; c.cd = w.interval/1000; c.ammo--; c.recoil = 1;
        const t = stackTarget(c.color), base = Math.atan2(t.y-c.y, t.x-c.x), sp = arena.w*3.2;
        for (let k = 0; k < w.pellets; k++) {
          const off = (w.pellets>1 ? (k-(w.pellets-1)/2) : 0)*w.spread, a = base+off;
          st.projectiles.push({ x: c.x, y: c.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, color: c.color, dmg: w.dmg });
        }
        if (navigator.vibrate) navigator.vibrate(8);
        if (c.ammo <= 0) c.weapon = null;
      }
    }

    for (let p = st.projectiles.length-1; p >= 0; p--) {
      const pr = st.projectiles[p]; pr.x += pr.vx*dt; pr.y += pr.vy*dt;
      // solid walls block shots
      let blocked = false;
      for (const w of walls) if (pr.x > w.x && pr.x < w.x+w.w && pr.y > w.y && pr.y < w.y+w.h) { blocked = true; break; }
      const t = stackTarget(pr.color);
      const reached = t.side === "L" ? pr.x <= t.x : pr.x >= t.x;
      const off = pr.y < board.y-20 || pr.y > board.y+board.h+20;
      if (blocked) { spark(pr.x, pr.y, pr.color, 4, 2); st.projectiles.splice(p,1); continue; }
      if (reached || off) {
        if (reached && st.goals[pr.color].count > 0) {
          st.goals[pr.color].count = Math.max(0, st.goals[pr.color].count - pr.dmg);
          spark(t.x, pr.y, PAL[pr.color].c, 8, 3);
          if (st.goals[pr.color].count === 0) declareWinner(pr.color);
        }
        st.projectiles.splice(p,1);
      }
    }
    updateFx(dt);
  }

  function declareWinner(color) {
    state.winner = color; state.winTimer = 3.0;
    const cx = board.x + board.w/2, cy = board.y + board.h*0.44;
    for (let i = 0; i < 100; i++) spark(cx, cy, PAL[state.colors[i % state.colors.length]].c, 1, 9);
    floaters.push({ x: cx, y: cy, text: color.toUpperCase()+" WINS!", color, life: 3.0 });
    if (navigator.vibrate) navigator.vibrate([50,60,50,60,120]);
  }
  function updateFx(dt) {
    for (let i = particles.length-1; i>=0; i--){ const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=dt*1.6; if(p.life<=0)particles.splice(i,1); }
    for (let i = floaters.length-1; i>=0; i--){ const f=floaters[i]; f.y-=dt*12; f.life-=dt; if(f.life<=0)floaters.splice(i,1); }
  }

  // ---------- render ----------
  function rrect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function draw() {
    const st = state;
    ctx.fillStyle = "#2f6d1f"; ctx.fillRect(0,0,W,H);
    const cs = 26; ctx.fillStyle = "rgba(0,0,0,.10)";
    for (let y=0;y<H;y+=cs) for (let x=0;x<W;x+=cs) if (((x/cs|0)+(y/cs|0))&1) ctx.fillRect(x,y,cs,cs);

    ctx.fillStyle = "#4f9e39"; rrect(board.x, board.y, board.w, board.h, 16); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.stroke();

    const gy = board.y + topH*0.52, gs = topH*0.7;
    drawWeapon(board.x + board.w*0.12, gy, "revolver", gs);
    drawWeapon(board.x + board.w*0.88, gy, "revolver", gs);
    drawFlag(board.x + board.w/2, gy, topH*0.5);

    ctx.fillStyle = "#bde7a0"; rrect(arena.x, arena.y, arena.w, arena.h, 10); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.stroke();

    for (const k of st.colors) drawStack(k);

    ctx.save(); rrect(arena.x, arena.y, arena.w, arena.h, 10); ctx.clip();
    // solid walls
    for (const w of wallsAbs()) drawWall(w);
    for (const sp of spikesAbs()) drawSpikeStar(sp);
    for (const pk of st.pickups) drawWeapon(pk.x, pk.y + Math.sin(pk.bob)*3, pk.type, arena.w*0.14);
    for (const c of st.cubes) drawTrail(c);
    for (const pr of st.projectiles) {
      ctx.save(); ctx.shadowColor = PAL[pr.color].c; ctx.shadowBlur = 8; ctx.fillStyle = PAL[pr.color].c;
      ctx.beginPath(); ctx.arc(pr.x, pr.y, Math.max(3, arena.w*0.02), 0, 7); ctx.fill(); ctx.restore();
    }
    for (const c of st.cubes) drawCube(c);
    ctx.restore();

    for (const p of particles) { ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); }
    ctx.globalAlpha = 1;

    ctx.fillStyle = "rgba(20,55,12,.38)"; ctx.font = `700 ${Math.max(12, arena.w*0.09)}px system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("@quadrush2d", board.x + board.w/2, board.y + board.h - 10);

    for (const f of floaters) {
      ctx.globalAlpha = Math.max(0, Math.min(1, f.life)); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      const s = Math.max(28, board.w*0.13); ctx.font = `900 ${s}px system-ui, sans-serif`;
      ctx.lineWidth = s*0.14; ctx.strokeStyle = "rgba(0,0,0,.6)"; ctx.strokeText(f.text, f.x, f.y);
      ctx.fillStyle = PAL[f.color].c; ctx.fillText(f.text, f.x, f.y); ctx.globalAlpha = 1;
    }

    ctx.fillStyle = "rgba(255,255,255,.9)"; ctx.textAlign = "center"; ctx.textBaseline = "top";
    ctx.font = `800 ${Math.max(12, board.w*0.04)}px system-ui, sans-serif`;
    ctx.fillText("ROUND " + st.round + "  •  " + st.colors.length + " CUBES", board.x + board.w/2, board.y + topH + 3);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawStack(color) {
    const r = region[color], g = state.goals[color], frac = g.count / g.max;
    ctx.fillStyle = PAL[color].d; rrect(r.x, r.y+2, r.w, r.h-4, 6); ctx.fill();
    const fw = (r.w - 6) * frac;
    const fx = r.side === "L" ? r.x + 3 : r.x + r.w - 3 - fw;
    ctx.save(); rrect(fx, r.y+5, Math.max(0,fw), r.h-10, 4); ctx.clip();
    ctx.fillStyle = PAL[color].c; ctx.fillRect(fx, r.y+5, Math.max(0,fw), r.h-10);
    ctx.fillStyle = "rgba(0,0,0,.18)";
    const step = Math.max(6, (r.h-10)/12);
    for (let y = r.y+5; y < r.y+r.h-5; y += step) ctx.fillRect(fx, y, r.w, 2);
    ctx.restore();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.5)"; rrect(r.x, r.y+2, r.w, r.h-4, 6); ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `900 ${Math.max(13, Math.min(r.w*0.42, r.h*0.55))}px system-ui, sans-serif`;
    ctx.lineWidth = Math.max(3, r.w*0.07); ctx.strokeStyle = "rgba(0,0,0,.7)";
    ctx.strokeText(g.count, r.x+r.w/2, r.y+r.h/2);
    ctx.fillStyle = "#fff"; ctx.fillText(g.count, r.x+r.w/2, r.y+r.h/2);
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }

  function drawWall(w) {
    ctx.fillStyle = "#3f8a2a"; rrect(w.x, w.y, w.w, w.h, 5); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.18)"; rrect(w.x, w.y + w.h*0.7, w.w, w.h*0.3, 5); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "rgba(0,0,0,.55)"; rrect(w.x, w.y, w.w, w.h, 5); ctx.stroke();
  }

  function drawTrail(c) {
    for (let i = 0; i < c.trail.length; i++) {
      const t = c.trail[i], a = (i/c.trail.length)*0.4, sz = c.size*(0.3 + i/c.trail.length*0.4);
      ctx.globalAlpha = a; ctx.fillStyle = PAL[c.color].c;
      rrect(t.x-sz/2, t.y-sz/2, sz, sz, sz*0.25); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawCube(c) {
    const s = c.size, x = c.x-s/2, y = c.y-s/2, r = s*0.16;
    ctx.fillStyle = PAL[c.color].c; rrect(x, y, s, s, r); ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,.18)"; rrect(x, y+s*0.72, s, s*0.28, r); ctx.fill();
    ctx.lineWidth = Math.max(2, s*0.08); ctx.strokeStyle = "#111"; rrect(x, y, s, s, r); ctx.stroke();
    const ew = s*0.28, eh = s*0.3, ey = y+s*0.24, ex1 = x+s*0.11, ex2 = x+s*0.61;
    for (const ex of [ex1, ex2]) {
      ctx.fillStyle = "#fff"; rrect(ex, ey, ew, eh, 2); ctx.fill();
      ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(1.5, s*0.04); rrect(ex, ey, ew, eh, 2); ctx.stroke();
      ctx.fillStyle = "#111"; ctx.beginPath();
      ctx.moveTo(ex, ey); ctx.lineTo(ex+ew*0.25, ey+eh*0.32); ctx.lineTo(ex+ew*0.5, ey);
      ctx.lineTo(ex+ew*0.75, ey+eh*0.32); ctx.lineTo(ex+ew, ey); ctx.lineTo(ex+ew, ey+eh*0.18);
      ctx.lineTo(ex, ey+eh*0.18); ctx.closePath(); ctx.fill();
    }
    if (c.weapon) {
      drawWeapon(c.x + s*0.5, c.y + c.recoil*3, c.weapon, s*0.7);
      ctx.fillStyle = "rgba(0,0,0,.8)"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      ctx.font = `800 ${Math.max(9, s*0.22)}px system-ui, sans-serif`;
      ctx.fillText("×"+c.ammo, c.x, c.y-s*0.55); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    }
  }

  function drawSpikeStar(sp) {
    ctx.save(); ctx.translate(sp.x, sp.y);
    const n = 9, ro = sp.r, ri2 = sp.r*0.6; ctx.beginPath();
    for (let i=0;i<n*2;i++){ const a=(i/(n*2))*Math.PI*2, rad=(i%2===0)?ro:ri2; ctx.lineTo(Math.cos(a)*rad, Math.sin(a)*rad); }
    ctx.closePath(); ctx.fillStyle = "#8e24aa"; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = "#4a148c"; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,ri2*0.5,0,7); ctx.fillStyle = "#6a1b8a"; ctx.fill(); ctx.restore();
  }

  function drawFlag(cx, cy, s) {
    const n = 4, u = s/n, x0 = cx-s/2, y0 = cy-s/2;
    for (let y=0;y<n;y++) for (let x=0;x<n;x++){ ctx.fillStyle = ((x+y)&1)?"#111":"#fff"; ctx.fillRect(x0+x*u, y0+y*u, u+0.5, u+0.5); }
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,.4)"; ctx.strokeRect(x0, y0, s, s);
  }

  function drawWeapon(x, y, type, size) {
    ctx.save(); ctx.translate(x, y); const w = size, h = size*0.5;
    ctx.fillStyle = "#2b2b2b"; ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
    if (type === "shotgun") {
      rrect(-w*0.55, -h*0.18, w*1.1, h*0.34, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#8a5a2b"; rrect(w*0.15, -h*0.1, w*0.45, h*0.5, 2); ctx.fill(); ctx.stroke();
    } else if (type === "revolver") {
      rrect(-w*0.5, -h*0.15, w*0.9, h*0.28, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#3b3b3b"; ctx.beginPath(); ctx.arc(-w*0.02, 0, h*0.3, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#2b2b2b"; rrect(-w*0.2, h*0.05, w*0.22, h*0.62, 2); ctx.fill(); ctx.stroke();
    } else if (type === "smg") {
      rrect(-w*0.5, -h*0.14, w*1.05, h*0.26, 2); ctx.fill(); ctx.stroke();
      rrect(-w*0.32, h*0.02, w*0.2, h*0.5, 2); ctx.fill(); ctx.stroke();
      rrect(-w*0.05, h*0.05, w*0.12, h*0.7, 2); ctx.fill(); ctx.stroke();
    } else {
      rrect(-w*0.45, -h*0.16, w*0.9, h*0.3, 2); ctx.fill(); ctx.stroke();
      rrect(-w*0.25, h*0.02, w*0.24, h*0.55, 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  let last = 0;
  function loop(now) { let dt=(now-last)/1000; last=now; if (dt>0.05) dt=0.05; update(dt); draw(); requestAnimationFrame(loop); }
  canvas.addEventListener("pointerdown", () => newRound(1));

  resize(); newRound(1); last = performance.now(); requestAnimationFrame(loop);
})();
</script>
